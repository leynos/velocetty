name: Install Linux E2E runtime dependencies
description: Install shared Linux packages required for packaged Electron E2E runs.

inputs:
  include_libarchive_tools:
    description: Install libarchive-tools in addition to runtime dependencies.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Linux dependency packages
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update

        packages=(
          xauth
          libasound2t64
          libatk-bridge2.0-0
          libatspi2.0-0
          libdrm2
          libgbm1
          libgtk-3-0
          libnss3
          libx11-xcb1
          libxcomposite1
          libxcursor1
          libxdamage1
          libxfixes3
          libxrandr2
          libxrender1
          libxkbcommon-x11-0
          libxi6
          libxshmfence1
          libxss1
          libxtst6
        )

        if [ "${{ inputs.include_libarchive_tools }}" = "true" ]; then
          packages+=(libarchive-tools)
        fi

        sudo apt-get install -y "${packages[@]}"
