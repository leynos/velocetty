name: Install Linux E2E runtime dependencies
description: Install shared Linux packages required for packaged Electron E2E runs.

inputs:
  include_libarchive_tools:
    description: Install libarchive-tools in addition to runtime dependencies.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Linux dependency packages
      shell: bash
      run: |
        set -euo pipefail
        apt_options=()
        host_arch=$(dpkg --print-architecture)
        if [ "$host_arch" = "arm64" ] \
          && dpkg --print-foreign-architectures | grep -qx "amd64" \
          && [ -r /etc/os-release ]; then
          . /etc/os-release
          if [ "${ID:-}" = "ubuntu" ]; then
            codename="${VERSION_CODENAME:-${UBUNTU_CODENAME:-}}"
            if [ -z "$codename" ]; then
              echo "Unable to determine Ubuntu codename for mixed-arch apt sources." >&2
              exit 1
            fi

            mixed_arch_sources="/tmp/velocetty-aarch64-runtime-deps.sources.list"
            cat <<EOF | sudo tee "$mixed_arch_sources" >/dev/null
        deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${codename} main restricted universe multiverse
        deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${codename}-updates main restricted universe multiverse
        deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${codename}-backports main restricted universe multiverse
        deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${codename}-security main restricted universe multiverse
        deb [arch=amd64] http://archive.ubuntu.com/ubuntu ${codename} main restricted universe multiverse
        deb [arch=amd64] http://archive.ubuntu.com/ubuntu ${codename}-updates main restricted universe multiverse
        deb [arch=amd64] http://archive.ubuntu.com/ubuntu ${codename}-backports main restricted universe multiverse
        deb [arch=amd64] http://security.ubuntu.com/ubuntu ${codename}-security main restricted universe multiverse
        EOF
            apt_options=(
              -o
              "Dir::Etc::sourcelist=${mixed_arch_sources}"
              -o
              "Dir::Etc::sourceparts=-"
            )
          fi
        fi

        sudo apt-get "${apt_options[@]}" update

        resolve_package_variant() {
          local package_name
          for package_name in "$@"; do
            if apt-cache "${apt_options[@]}" show "$package_name" >/dev/null 2>&1; then
              printf '%s\n' "$package_name"
              return 0
            fi
          done

          return 1
        }

        libasound_package="$(resolve_package_variant libasound2t64 libasound2 || true)"
        if [ -z "$libasound_package" ]; then
          echo "Unable to resolve libasound package variant (tried libasound2t64, libasound2)." >&2
          exit 1
        fi

        packages=(
          xauth
          "$libasound_package"
          libatk-bridge2.0-0
          libatspi2.0-0
          libdrm2
          libgbm1
          libgtk-3-0
          libnss3
          libx11-xcb1
          libxcomposite1
          libxcursor1
          libxdamage1
          libxfixes3
          libxrandr2
          libxrender1
          libxkbcommon-x11-0
          libxi6
          libxshmfence1
          libxss1
          libxtst6
        )

        if [ "${{ inputs.include_libarchive_tools }}" = "true" ]; then
          packages+=(libarchive-tools)
        fi

        sudo apt-get "${apt_options[@]}" install -y "${packages[@]}"
