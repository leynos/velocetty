name: Proofs
on:
  pull_request:
    paths:
      - 'shared/src/settings/**'
      - '**/*.dfy'
      - '**/*.dfy.gen'
      - 'LemmaScript-files.txt'
      - 'Makefile'
      - 'scripts/check-proof-freshness.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/proofs.yml'
  workflow_dispatch:
defaults:
  run:
    shell: bash
env:
  DAFNY_VERSION: 4.11.0
jobs:
  dafny:
    # Advisory while the proof suite settles; see ADR 007. Promote to a
    # required check after two green weeks.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Cache Dafny
        id: cache-dafny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.dotnet/tools
          key: dafny-${{ env.DAFNY_VERSION }}-${{ runner.os }}
      - name: Install Dafny
        if: steps.cache-dafny.outputs.cache-hit != 'true'
        run: dotnet tool install --global dafny --version "${DAFNY_VERSION}"
      - name: Add Dafny to PATH
        run: echo "${HOME}/.dotnet/tools" >> "${GITHUB_PATH}"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify proofs
        run: make proofs
      - name: Check generated artefacts are current
        run: make proofs-fresh