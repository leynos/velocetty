name: Node CI
on:
  push:
    branches:
      - master
      - canary
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
defaults:
  run:
    shell: bash
env:
  NODE_VERSION: 24.11.1
jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Use Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: 1.3.8
      - name: Fix node-gyp and Python
        id: setup_node_gyp_python
        run: .github/scripts/setup-node-gyp-python.sh "$RUNNER_TEMP/node-gyp-python"
      - name: Export node-gyp environment
        run: |
          printf 'PYTHON=%s\n' "${{ steps.setup_node_gyp_python.outputs.python }}" >> "$GITHUB_ENV"
          printf 'npm_config_python=%s\n' "${{ steps.setup_node_gyp_python.outputs.python }}" >> "$GITHUB_ENV"
          printf 'npm_config_node_gyp=%s\n' "${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
      - name: Install
        if: runner.os != 'Windows'
        run: bun install
      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: |
          bun install --ignore-scripts
          if [ ! -f node_modules/.bin/node-gyp.cmd ]; then
            printf '%s\r\n' '@ECHO OFF' 'node "%~dp0\..\node-gyp\bin\node-gyp.js" %*' > node_modules/.bin/node-gyp.cmd
          fi
          test -f node_modules/.bin/node-gyp.cmd
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          bun install
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_tmp: ${{ runner.temp }}
      - name: Install libarchive-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Run Makefile lint and unit-test gates
        run: |
          make lint
          make test
      - name: Getting Build Icon
        if: github.ref == 'refs/heads/canary' || github.base_ref == 'canary'
        run: |
          cp build/canary.ico build/icon.ico
          cp build/canary.icns build/icon.icns
      - name: Build
        uses: ./.github/actions/build-packaged-app
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          csc_link: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          csc_key_password: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_PASSWORD || '' }}
          win_csc_link: ${{ runner.os == 'Windows' && secrets.WIN_CERT_P12_BASE64 || '' }}
          win_csc_key_password: ${{ runner.os == 'Windows' && secrets.WIN_CERT_P12_PASSWORD || '' }}
          apple_id: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          apple_app_specific_password: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
      - name: Archive Build Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.snap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.exe
          if-no-files-found: warn
      - name: Run fast-lane E2E tests
        if: runner.os != 'Linux'
        run: bun run test:e2e:fast
      - name: Install Linux E2E runtime deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-e2e-runtime-deps
      - name: Run fast-lane E2E tests on Linux
        if: runner.os == 'Linux'
        uses: GabrielBB/xvfb-action@b706e4e27b14669b486812790492dc50ca16b465 # v1.7
        with:
          run: bun run test:e2e:fast
        env:
          DEBUG: pw:browser*
          ELECTRON_ENABLE_LOGGING: '1'
          ELECTRON_ENABLE_STACK_DUMPING: '1'
          SHELL: /bin/bash
      - name: Debug Linux Electron bundle
        if: failure() && runner.os == 'Linux'
        run: |
          set -euxo pipefail
          ls -la dist
          ls -la dist/linux-unpacked
          file dist/linux-unpacked/hyper || true
          ldd dist/linux-unpacked/hyper || true
      - name: Archive E2E test screenshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-${{ matrix.os }}
          path: dist/tmp/*.png
          if-no-files-found: warn
      - name: Save the pr number in an artifact
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          PR_NUM: ${{ github.event.number }}
        run: echo $PR_NUM > pr_num.txt
      - name: Upload the pr num
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        with:
          name: pr_num
          path: ./pr_num.txt

  e2e-deep-linux:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/canary'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Use Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: 1.3.8
      - name: Fix node-gyp and Python
        id: setup_node_gyp_python
        run: .github/scripts/setup-node-gyp-python.sh "$RUNNER_TEMP/node-gyp-python"
      - name: Export node-gyp environment
        run: |
          printf 'PYTHON=%s\n' "${{ steps.setup_node_gyp_python.outputs.python }}" >> "$GITHUB_ENV"
          printf 'npm_config_python=%s\n' "${{ steps.setup_node_gyp_python.outputs.python }}" >> "$GITHUB_ENV"
          printf 'npm_config_node_gyp=%s\n' "${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
      - name: Install
        run: bun install
      - name: Install Linux build and E2E runtime deps
        uses: ./.github/actions/install-linux-e2e-runtime-deps
        with:
          include_libarchive_tools: 'true'
      - name: Build packaged app
        uses: ./.github/actions/build-packaged-app
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run deep-lane E2E tests
        uses: GabrielBB/xvfb-action@b706e4e27b14669b486812790492dc50ca16b465 # v1.7
        with:
          run: bun run test:e2e:deep
        env:
          DEBUG: pw:browser*
          ELECTRON_ENABLE_LOGGING: '1'
          ELECTRON_ENABLE_STACK_DUMPING: '1'
          SHELL: /bin/bash
      - name: Upload deep-lane E2E artefacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-deep-linux
          path: |
            test-results/e2e-deep/**
            playwright-report/e2e-deep/**
          if-no-files-found: warn

  build-linux-aarch64:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Use Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: 1.3.8
      - name: Fix node-gyp and Python
        id: setup_node_gyp_python
        run: .github/scripts/setup-node-gyp-python.sh "$RUNNER_TEMP/node-gyp-python"
      - name: Export node-gyp environment
        run: |
          printf 'PYTHON=%s\n' "${{ steps.setup_node_gyp_python.outputs.python }}" >> "$GITHUB_ENV"
          printf 'npm_config_python=%s\n' "${{ steps.setup_node_gyp_python.outputs.python }}" >> "$GITHUB_ENV"
          printf 'npm_config_node_gyp=%s\n' "${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
      - name: Prepare x64 snapshot sysroot for Linux aarch64
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture amd64
          mixed_arch_sources=/tmp/velocetty-aarch64-bootstrap.sources.list
          bash .github/scripts/configure-ubuntu-mixed-arch-apt-sources.sh "$mixed_arch_sources"
          sudo apt-get \
            -o Dir::Etc::sourcelist="$mixed_arch_sources" \
            -o Dir::Etc::sourceparts=- \
            update
          sudo apt-get \
            -o Dir::Etc::sourcelist="$mixed_arch_sources" \
            -o Dir::Etc::sourceparts=- \
            install -y --no-install-recommends \
            qemu-user-static \
            libc6:amd64 \
            libstdc++6:amd64 \
            libgcc-s1:amd64 \
            libglib2.0-0:amd64 \
            libexpat1:amd64 \
            libpcre2-8-0:amd64
          test -x /usr/bin/qemu-x86_64-static
          test -f /lib64/ld-linux-x86-64.so.2 || test -f /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
          echo "QEMU_LD_PREFIX=/" >> "$GITHUB_ENV"
      - name: Install
        run: bun install
        env:
          SKIP_V8_SNAPSHOT: '1'
          SKIP_NODE_PTY_REBUILD: '1'
      - name: Install Linux build and E2E runtime deps
        uses: ./.github/actions/install-linux-e2e-runtime-deps
        with:
          include_libarchive_tools: 'true'
      - name: Install fpm for rpm/pacman package builds
        run: |
          # fpm is a Ruby gem for building rpm, deb, and pacman packages
          # Use Bundler with committed Gemfile.lock for reproducible dependency resolution
          # Extract the Bundler version from Gemfile.lock (BUNDLED WITH section)
          # Non-fatal awk extraction that falls back to empty string on error
          bundler_version=$(awk '/^BUNDLED WITH/{getline; print; exit}' Gemfile.lock 2>/dev/null | tr -d ' ' || true)
          # Fallback to hard-pinned version if extraction fails or result is empty
          if [ -z "$bundler_version" ]; then
            bundler_version="2.4.0"
          fi
          echo "Installing Bundler version: $bundler_version"
          sudo gem install bundler -v "$bundler_version" --no-document
          sudo bundle _"${bundler_version}"_ install --jobs 4 --retry 3 --frozen
          # Generate binstub so fpm is available in PATH for electron-builder
          sudo bundle _"${bundler_version}"_ binstubs fpm --path /usr/local/bin
      - name: Install appimagetool for AppImage builds
        run: |
          set -euo pipefail
          # Install libfuse2 first (required for AppImage to run)
          sudo apt-get install -y libfuse2
          # Download and install appimagetool for AppImage builds
          # Pinned to release 1.9.1 for reproducible builds; update periodically
          appimage_url="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-aarch64.AppImage"
          wget --timeout=60 -q --tries=3 --waitretry=5 --retry-connrefused "$appimage_url" -O /tmp/appimagetool
          # Primary: verify SHA-256 checksum (appimagetool 1.9.1 aarch64)
          echo 'f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158  /tmp/appimagetool' | sha256sum -c -
          chmod +x /tmp/appimagetool
          # Secondary: verify file is a valid ELF binary
          file /tmp/appimagetool | grep -q "ELF" || { echo "Downloaded file is not a valid ELF binary"; exit 1; }
          # Secondary: test appimagetool works (print version)
          /tmp/appimagetool --version || { echo "appimagetool is not functional"; exit 1; }
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Run lint gate
        run: make lint
      - name: Run test gate
        run: make test
      - name: Run build gate
        run: bun run build
      - name: Build
        run: bun bin/run-electron-builder.cjs -l deb rpm AppImage pacman --arm64 -c electron-builder-linux-ci.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_V8_SNAPSHOT_COPY: '1'
      - name: Archive Build Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-linux-arm64
          path: |
            dist/*.snap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
          if-no-files-found: warn
