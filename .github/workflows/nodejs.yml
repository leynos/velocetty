name: Node CI
on:
  push:
    branches:
      - master
      - canary
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
defaults:
  run:
    shell: bash
env:
  NODE_VERSION: 20.x
jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Use Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: 1.3.8
      - name: Fix node-gyp and Python
        run: python3 -m pip install packaging setuptools
      - name: Install
        run: bun install
        env:
          npm_config_node_gyp: ${{ github.workspace }}${{ runner.os == 'Windows' && '\node_modules\node-gyp\bin\node-gyp.js' || '/node_modules/node-gyp/bin/node-gyp.js' }}
      - name: Install libarchive-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Lint and Run Unit Tests
        run: |
          bun run lint
          bun test
      - name: Getting Build Icon
        if: github.ref == 'refs/heads/canary' || github.base_ref == 'canary'
        run: |
          cp build/canary.ico build/icon.ico
          cp build/canary.icns build/icon.icns
      - name: Build
        uses: ./.github/actions/build-packaged-app
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          csc_link: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          csc_key_password: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_PASSWORD || '' }}
          win_csc_link: ${{ runner.os == 'Windows' && secrets.WIN_CERT_P12_BASE64 || '' }}
          win_csc_key_password: ${{ runner.os == 'Windows' && secrets.WIN_CERT_P12_PASSWORD || '' }}
          apple_id: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          apple_app_specific_password: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
      - name: Archive Build Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.snap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.exe
          if-no-files-found: warn
      - name: Run fast-lane E2E tests
        if: runner.os != 'Linux'
        run: bun run test:e2e:fast
      - name: Install Linux E2E runtime deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-e2e-runtime-deps
      - name: Run fast-lane E2E tests on Linux
        if: runner.os == 'Linux'
        uses: GabrielBB/xvfb-action@b706e4e27b14669b486812790492dc50ca16b465 # v1.7
        with:
          run: bun run test:e2e:fast
        env:
          DEBUG: pw:browser*
          ELECTRON_ENABLE_LOGGING: '1'
          ELECTRON_ENABLE_STACK_DUMPING: '1'
          SHELL: /bin/bash
      - name: Debug Linux Electron bundle
        if: failure() && runner.os == 'Linux'
        run: |
          set -euxo pipefail
          ls -la dist
          ls -la dist/linux-unpacked
          file dist/linux-unpacked/hyper || true
          ldd dist/linux-unpacked/hyper || true
      - name: Archive E2E test screenshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-${{ matrix.os }}
          path: dist/tmp/*.png
          if-no-files-found: warn
      - name: Save the pr number in an artifact
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          PR_NUM: ${{ github.event.number }}
        run: echo $PR_NUM > pr_num.txt
      - name: Upload the pr num
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        with:
          name: pr_num
          path: ./pr_num.txt

  e2e-deep-linux:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/canary'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Use Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: 1.3.8
      - name: Fix node-gyp and Python
        run: python3 -m pip install packaging setuptools
      - name: Install
        run: bun install
        env:
          npm_config_node_gyp: ${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js
      - name: Install Linux build and E2E runtime deps
        uses: ./.github/actions/install-linux-e2e-runtime-deps
        with:
          include_libarchive_tools: 'true'
      - name: Build packaged app
        uses: ./.github/actions/build-packaged-app
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run deep-lane E2E tests
        uses: GabrielBB/xvfb-action@b706e4e27b14669b486812790492dc50ca16b465 # v1.7
        with:
          run: bun run test:e2e:deep
        env:
          DEBUG: pw:browser*
          ELECTRON_ENABLE_LOGGING: '1'
          ELECTRON_ENABLE_STACK_DUMPING: '1'
          SHELL: /bin/bash
      - name: Upload deep-lane E2E artefacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-deep-linux
          path: |
            test-results/e2e-deep/**
            playwright-report/e2e-deep/**
          if-no-files-found: warn

  build-linux-arm:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: armv7l
            cpu: cortex-a8
            image: raspios_lite:latest
          - name: arm64
            cpu: cortex-a53
            image: raspios_lite_arm64:latest
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Use Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: 1.3.8
      - name: Fix node-gyp and Python
        run: python3 -m pip install packaging setuptools
      - name: Install
        run: |
          bun install
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Compile
        run: bun run build
      - name: rebuild node-pty
        uses: pguyot/arm-runner-action@e1773de1ed6eb61848f5693de824d836f0b0ea25 # v2.6.5
        with:
          image_additional_mb: 2000
          base_image: ${{ matrix.image }}
          cpu: ${{ matrix.cpu }}
          shell: bash
          copy_artifact_path: target/node_modules/node-pty
          copy_artifact_dest: target/node_modules
          commands: |
            wget https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-${{ matrix.name }}.tar.xz
            tar -xJf node-v20.18.1-linux-${{ matrix.name }}.tar.xz
            sudo cp node-v20.18.1-linux-${{ matrix.name }}/* /usr/local/ -R
            npm run rebuild-node-pty
      - name: chown node-pty
        run: |
          sudo chown -R $USER:$USER target/node_modules/node-pty
      - name: Prepare v8 snapshot
        if: matrix.name == 'armv7l'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0:i386 libexpat1:i386 libgcc-s1:i386
          npm_config_arch=armv7l bun run v8-snapshot:arch
      - name: Build
        run: bun bin/run-electron-builder.cjs -l deb rpm AppImage pacman --${{ matrix.name }} -c electron-builder-linux-ci.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Archive Build Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-linux-${{ matrix.name }}
          path: |
            dist/*.snap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
          if-no-files-found: warn
