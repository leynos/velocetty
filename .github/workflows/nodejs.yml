name: Node CI
on:
  push:
    branches:
      - master
      - canary
  pull_request:
defaults:
  run:
    shell: bash
env:
  NODE_VERSION: 18.x
jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7
      - name: Fix node-gyp and Python
        run: python3 -m pip install packaging setuptools
      - name: Install
        run: bun install
        env:
          npm_config_node_gyp: ${{ github.workspace }}${{ runner.os == 'Windows' && '\node_modules\node-gyp\bin\node-gyp.js' || '/node_modules/node-gyp/bin/node-gyp.js' }}
      - name: Install libarchive-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install libarchive-tools
      - name: Lint and Run Unit Tests
        run: |
          bun run lint
          bun test
      - name: Getting Build Icon
        if: github.ref == 'refs/heads/canary' || github.base_ref == 'canary'
        run: |
          cp build/canary.ico build/icon.ico
          cp build/canary.icns build/icon.icns
      - name: Build
        run: |
          if [ -z "$CSC_LINK" ] ; then unset CSC_LINK ; fi
          if [ -z "$CSC_KEY_PASSWORD" ] ; then unset CSC_KEY_PASSWORD ; fi
          if [ -z "$WIN_CSC_LINK" ] ; then unset WIN_CSC_LINK ; fi
          if [ -z "$WIN_CSC_KEY_PASSWORD" ] ; then unset WIN_CSC_KEY_PASSWORD ; fi
          if [ -z "$APPLE_ID" ] ; then unset APPLE_ID ; fi
          if [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] ; then unset APPLE_APP_SPECIFIC_PASSWORD ; fi
          bun run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.snap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.exe
          if-no-files-found: warn
      - name: Run E2E Tests
        if: runner.os != 'Linux'
        run: bun run test:e2e
      - name: Install Linux E2E runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xauth \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libx11-xcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxrender1 \
            libxkbcommon-x11-0 \
            libxi6 \
            libxshmfence1 \
            libxss1 \
            libxtst6
      - name: Run E2E Tests on Linux
        if: runner.os == 'Linux'
        uses: GabrielBB/xvfb-action@v1.7
        with:
          run: bun run test:e2e
        env:
          DEBUG: pw:browser*
          ELECTRON_ENABLE_LOGGING: '1'
          ELECTRON_ENABLE_STACK_DUMPING: '1'
        env:
          SHELL: /bin/bash
      - name: Debug Linux Electron bundle
        if: failure() && runner.os == 'Linux'
        run: |
          set -euxo pipefail
          ls -la dist
          ls -la dist/linux-unpacked
          file dist/linux-unpacked/hyper || true
          ldd dist/linux-unpacked/hyper || true
      - name: Archive E2E test screenshot
        uses: actions/upload-artifact@v6
        with:
          name: e2e-${{ matrix.os }}
          path: dist/tmp/*.png
          if-no-files-found: warn
      - name: Save the pr number in an artifact
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          PR_NUM: ${{ github.event.number }}
        run: echo $PR_NUM > pr_num.txt
      - name: Upload the pr num
        uses: actions/upload-artifact@v6
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        with:
          name: pr_num
          path: ./pr_num.txt

  build-linux-arm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: armv7l
            cpu: cortex-a8
            image: raspios_lite:latest
          - name: arm64
            cpu: cortex-a53
            image: raspios_lite_arm64:latest
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7
      - name: Fix node-gyp and Python
        run: python3 -m pip install packaging setuptools
      - name: Install
        run: |
          bun install
          sudo apt-get update
          sudo apt-get install libarchive-tools
      - name: Compile
        run: bun run build
      - name: rebuild node-pty
        uses: pguyot/arm-runner-action@v2.6.5
        with:
          image_additional_mb: 2000
          base_image: ${{ matrix.image }}
          cpu: ${{ matrix.cpu }}
          shell: bash
          copy_artifact_path: target/node_modules/node-pty
          copy_artifact_dest: target/node_modules
          commands: |
            wget https://nodejs.org/dist/v18.16.0/node-v18.16.0-linux-${{ matrix.name }}.tar.xz
            tar -xJf node-v18.16.0-linux-${{ matrix.name }}.tar.xz
            sudo cp node-v18.16.0-linux-${{ matrix.name }}/* /usr/local/ -R
            npm run rebuild-node-pty
      - name: chown node-pty
        run: |
          sudo chown -R $USER:$USER target/node_modules/node-pty
      - name: Prepare v8 snapshot
        if: matrix.name == 'armv7l'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0:i386 libexpat1:i386 libgcc-s1:i386
          npm_config_arch=armv7l bun run v8-snapshot:arch
      - name: Build
        run: bun bin/run-electron-builder.cjs -l deb rpm AppImage pacman --${{ matrix.name }} -c electron-builder-linux-ci.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-linux-${{ matrix.name }}
          path: |
            dist/*.snap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
          if-no-files-found: warn
