# Repository-specific quotations and machine interfaces.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # Inline code spans, which this repository's spelling check has always
  # masked; preserved through the migration to the shared gate.
  '`[^`\n]+`',
  # Preserve an established public TypeScript type and an external command.
  '\bColorMap\b',
  'nl -ba',
]

[files]
exclude = [
  # This standalone upstream bundle is marked as vendored in .gitattributes.
  "bin/rimraf-standalone.js",
  # Dafny artefacts generated from annotated TypeScript. The `.dfy.gen` file is
  # regenerated wholesale by `lsc`, and identifiers such as `i_state_gate` are
  # the tool's own naming, not prose this repository owns.
  "*.dfy",
  "*.dfy.gen",
]
